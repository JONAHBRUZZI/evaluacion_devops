name: Deploy to AWS EC2

on:
  push:
    branches:
      - deploy
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: 'Skip Terraform deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_ec2_deploy:
        description: 'Skip EC2 deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      destroy_only:
        description: 'Destroy all infrastructure (ignores other options)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  terraform-destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.destroy_only == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    if: github.event.inputs.destroy_only != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front_despacho/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front_despacho

      - name: Run ESLint
        continue-on-error: true
        run: npm run lint -- --max-warnings 10
        working-directory: front_despacho

      - name: Build frontend
        run: npm run build
        working-directory: front_despacho

  build-backend-ventas:
    name: Build Backend Ventas
    runs-on: ubuntu-latest
    if: github.event.inputs.destroy_only != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST

  build-backend-despachos:
    name: Build Backend Despachos
    runs-on: ubuntu-latest
    if: github.event.inputs.destroy_only != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

  docker-build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [validate, build-backend-ventas, build-backend-despachos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front_despacho
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend-ventas
        uses: docker/build-push-action@v5
        with:
          context: ./back-Ventas_SpringBoot
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-backend-ventas:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-backend-ventas:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend-despachos
        uses: docker/build-push-action@v5
        with:
          context: ./back-Despachos_SpringBoot
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-backend-despachos:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-backend-despachos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.event.inputs.skip_terraform != 'true'
    outputs:
      ec2_public_ip: ${{ steps.get-ip.outputs.ec2_public_ip }}
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Format
        run: terraform fmt
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Get EC2 Public IP
        id: get-ip
        run: echo "ec2_public_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
        working-directory: infra

      - name: Display EC2 IP
        run: |
          echo "EC2 Public IP: ${{ steps.get-ip.outputs.ec2_public_ip }}"

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "=== DEPLOY FAILED - DESTROYING RESOURCES ==="
          terraform destroy -auto-approve
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: terraform-deploy
    if: github.event.inputs.skip_ec2_deploy != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for EC2 to be ready
        run: sleep 120

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform-deploy.outputs.ec2_public_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-frontend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-backend-ventas:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-backend-despachos:latest
            cd /app
            sudo tee .env > /dev/null << 'EOF'
            DB_ENDPOINT=${{ secrets.DB_ENDPOINT }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            sudo tee docker-compose.yml > /dev/null << 'COMPOSEEOF'
            services:
              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-frontend:latest
                container_name: evaluation-devops-frontend
                ports:
                  - "80:80"
                networks:
                  - evaluation-network
                restart: unless-stopped
              backend-ventas:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-backend-ventas:latest
                container_name: evaluation-devops-backend-ventas
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  - DB_ENDPOINT=${{ secrets.DB_ENDPOINT }}
                  - DB_PORT=${{ secrets.DB_PORT }}
                  - DB_NAME=${{ secrets.DB_NAME }}
                  - DB_USERNAME=${{ secrets.DB_USERNAME }}
                  - DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                ports:
                  - "8080:8080"
                networks:
                  - evaluation-network
                restart: unless-stopped
              backend-despachos:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/evaluation-devops-backend-despachos:latest
                container_name: evaluation-devops-backend-despachos
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  - DB_ENDPOINT=${{ secrets.DB_ENDPOINT }}
                  - DB_PORT=${{ secrets.DB_PORT }}
                  - DB_NAME=${{ secrets.DB_NAME }}
                  - DB_USERNAME=${{ secrets.DB_USERNAME }}
                  - DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                ports:
                  - "8081:8081"
                networks:
                  - evaluation-network
                restart: unless-stopped
            networks:
              evaluation-network:
                driver: bridge
            COMPOSEEOF
            sudo docker-compose up -d

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-to-ec2, terraform-deploy]
    if: github.event.inputs.skip_ec2_deploy != 'true'
    steps:
      - name: Wait for services
        run: sleep 30

      - name: Check frontend
        run: curl -f -s -o /dev/null -w "%{http_code}" http://${{ needs.terraform-deploy.outputs.ec2_public_ip }}/

      - name: Check backend ventas
        run: curl -f -s -o /dev/null -w "%{http_code}" http://${{ needs.terraform-deploy.outputs.ec2_public_ip }}:8080/actuator/health

      - name: Check backend despachos
        run: curl -f -s -o /dev/null -w "%{http_code}" http://${{ needs.terraform-deploy.outputs.ec2_public_ip }}:8081/actuator/health

      - name: Final status
        run: |
          echo "========================================"
          echo "  DEPLOYMENT COMPLETED"
          echo "========================================"
          echo "Frontend: http://${{ needs.terraform-deploy.outputs.ec2_public_ip }}"
          echo "Backend Ventas: http://${{ needs.terraform-deploy.outputs.ec2_public_ip }}:8080"
          echo "Backend Despachos: http://${{ needs.terraform-deploy.outputs.ec2_public_ip }}:8081"
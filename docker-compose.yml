services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-evaluation-devops}/evaluation-devops-frontend:latest
    container_name: evaluation-devops-frontend
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - evaluation-network
    depends_on:
      backend-ventas:
        condition: service_healthy
      backend-despachos:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend-ventas:
    image: ${DOCKERHUB_USERNAME:-evaluation-devops}/evaluation-devops-backend-ventas:latest
    container_name: evaluation-devops-backend-ventas
    build:
      context: ./back-Ventas_SpringBoot
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_ENDPOINT=${DB_ENDPOINT:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-evaluation_devops}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    networks:
      - evaluation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend-despachos:
    image: ${DOCKERHUB_USERNAME:-evaluation-devops}/evaluation-devops-backend-despachos:latest
    container_name: evaluation-devops-backend-despachos
    build:
      context: ./back-Despachos_SpringBoot
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_ENDPOINT=${DB_ENDPOINT:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-evaluation_devops}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    ports:
      - "8081:8081"
    networks:
      - evaluation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  evaluation-network:
    driver: bridge
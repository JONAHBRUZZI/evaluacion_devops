version: '3.8'

services:
  frontend:
    image: evaluation-devops-frontend:latest
    container_name: evaluation-devops-frontend
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - evaluation-network
    depends_on:
      backend-ventas:
        condition: service_healthy
      backend-despachos:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-redirect", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend-ventas:
    image: evaluation-devops-backend-ventas:latest
    container_name: evaluation-devops-backend-ventas
    build:
      context: ./back-Ventas_SpringBoot
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_ENDPOINT=${DB_ENDPOINT}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - evaluation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-redirect", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend-despachos:
    image: evaluation-devops-backend-despachos:latest
    container_name: evaluation-devops-backend-despachos
    build:
      context: ./back-Despachos_SpringBoot
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_ENDPOINT=${DB_ENDPOINT}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - evaluation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-redirect", "-q", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  evaluation-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16